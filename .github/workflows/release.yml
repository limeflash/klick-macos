# Выпуск kl!ck для macOS: собрать пакет на Mac, проверить и выложить в Releases. Запуск — тегом v*
#   git tag v0.9.0 && git push origin v0.9.0
# или вручную (Actions → Release → Run workflow на нужной ветке): тег v<версия из Cargo.toml> тогда
# ставится на проверенный коммит при создании выпуска.
# В выпуске два файла: klick-<версия>.pkg и klick-macos.pkg — для постоянной ссылки
# https://github.com/<владелец>/<репозиторий>/releases/latest/download/klick-macos.pkg
# Пакет не подписан сертификатом Apple (ставится из Терминала: sudo installer -pkg … -target /).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Rust
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Версия выпуска
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            [ "${GITHUB_REF_NAME#v}" = "$ver" ] || { echo "тег $GITHUB_REF_NAME, а в Cargo.toml $ver"; exit 1; }
          elif gh release view "v$ver" >/dev/null 2>&1; then
            echo "выпуск v$ver уже есть — поднимите версию в Cargo.toml"; exit 1
          fi
          echo "VER=$ver" >> "$GITHUB_ENV"
          echo "TAG=v$ver" >> "$GITHUB_ENV"

      - name: Сборка kl!ck.app и .pkg (universal)
        env:
          # «Проверить обновления» в окне смотрит выпуски этого репозитория.
          KLICK_RELEASES_REPO: ${{ github.repository }}
        run: scripts/macos/build.sh

      - name: Тесты
        run: cargo test --workspace

      - name: Конфиги ядра (mihomo -t)
        run: scripts/check-configs.sh

      - name: Сквозная проверка на этом Mac
        run: sudo scripts/macos/smoke-test.sh 'dist/kl!ck.app'

      - name: Выпуск
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="$VER"
          cp "dist/klick-$ver.pkg" dist/klick-macos.pkg
          cat > notes.md <<NOTES
          kl!ck $ver для macOS 12+ (Apple Silicon и Intel).

          Установка из Терминала (пакет не подписан сертификатом Apple, поэтому так проще, чем двойным щелчком):

          \`\`\`sh
          curl -fL -o /tmp/klick.pkg https://github.com/${{ github.repository }}/releases/download/$TAG/klick-macos.pkg
          sudo installer -pkg /tmp/klick.pkg -target /
          open -a 'kl!ck'
          \`\`\`

          Удаление: \`sudo '/Applications/kl!ck.app/Contents/Resources/uninstall.sh'\`
          NOTES
          # Тега ещё нет (ручной запуск) — gh ставит его на этот коммит.
          gh release create "$TAG" "dist/klick-$ver.pkg" dist/klick-macos.pkg --target "$GITHUB_SHA" \
            --title "kl!ck $ver для macOS" --notes-file notes.md
