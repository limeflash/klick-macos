# Сборка и проверка kl!ck для macOS на настоящем Mac (Apple Silicon): kl!ck.app и .pkg,
# тесты, конфиги ядра (mihomo -t) и сквозная проверка с установкой службы (scripts/macos/smoke-test.sh).
# Запуск вручную (Actions → macOS → Run workflow) со ссылкой подписки проверяет ещё и настоящие серверы
# (scripts/macos/real-test.sh). Ссылка не сохраняется в репозитории и скрыта в журнале.
name: macOS

# Правки только документации сборку на Mac не запускают.
on:
  push:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:
    inputs:
      sub:
        description: Ссылка подписки для проверки с настоящими серверами (необязательно)
        required: false
        default: ''

# Новый пуш ждёт, пока доработает текущая сборка, а не отменяет её (ждёт только самый свежий).
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      # Ссылку подписки берём из события, а не из env: значения env шаг печатает в журнал.
      - name: Скрыть ссылку подписки в журнале
        if: github.event_name == 'workflow_dispatch'
        run: |
          sub="$(jq -r '.inputs.sub // empty' "$GITHUB_EVENT_PATH")"
          if [ -n "$sub" ]; then echo "::add-mask::$sub"; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Rust
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc -V

      - uses: Swatinem/rust-cache@v2

      - name: Сборка kl!ck.app и .pkg (universal)
        run: scripts/macos/build.sh

      - name: Тесты
        run: cargo test --workspace

      - name: Конфиги ядра (mihomo -t)
        run: scripts/check-configs.sh

      - name: Сквозная проверка на этом Mac
        run: sudo scripts/macos/smoke-test.sh "dist/kl!ck.app"

      - name: Проверка с настоящими серверами
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.sub != '' }}
        run: |
          sub="$(jq -r '.inputs.sub // empty' "$GITHUB_EVENT_PATH")"
          sudo /usr/bin/env "KLICK_TEST_SUB=$sub" scripts/macos/real-test.sh "dist/kl!ck.app"

      - name: Архив приложения
        if: always()
        run: |
          if [ -d "dist/kl!ck.app" ]; then ditto -c -k --keepParent "dist/kl!ck.app" "dist/klick-macos-app.zip"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: klick-macos
          path: |
            dist/*.pkg
            dist/klick-macos-app.zip
          if-no-files-found: ignore
